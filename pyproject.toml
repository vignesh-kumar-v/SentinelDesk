[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentineldesk"
version = "0.1.0"
description = "A support-ticket agent graph whose resolution model is a DPO-tuned training artifact, not a prompted API call."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Vignesh Kumar V" }]

dependencies = [
  # modelling / training
  "torch>=2.4",
  "transformers>=4.44",
  "tokenizers>=0.19",
  "safetensors>=0.4",
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  # agents
  "langgraph>=0.2",
  "langchain-core>=0.3",
  # serving / clients
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  # plumbing
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
stretch = ["nemoguardrails>=0.11", "langfuse>=2.50"]

[project.scripts]
sentineldesk = "sentineldesk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["sentineldesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:warnings"
markers = [
  "slow: long-running (training / generation)",
  "needs_judge: requires a reachable judge endpoint (ollama)",
  "needs_model: requires the base model weights on disk",
]
